[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-pc-controller"
version = "0.1.0"
description = "Autonomous AI Desktop & Application Control System with Native MCP Server"
readme = "README.md"
authors = [{ name = "deepboyearn" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "mcp>=1.2.0"
]

[project.scripts]
cortex-controller = "cortex_controller.cli:main"
